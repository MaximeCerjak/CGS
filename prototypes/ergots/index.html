<script>
'use strict';
// Ergots — prototype de duels de coqs au tour par tour.
// Tout est dessiné en code, en pixel art : chaque coq est construit cellule par cellule.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const R = window.ROSTER;
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size; the pixel look is drawn as cells, the text stays crisp
const PIXEL = false;
const FONT = '"Courier New", Courier, monospace';
const TITLE = 'ERGOTS';
const CONTROLS = [
  'Au poulailler : 1-3 coq · L/C circuit · S soigner · P payer le loyer · N passer un duel · R répartir · Entrée : arène',
  'En duel : 1-4 attaque · E encourager · P mettre la pression · Espace valider · A abandonner · H historique',
  'Tout se fait aussi à la souris · M : couper le son',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', bold = true) {
  ctx.fillStyle = c; ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function frameBox(x, y, w, h, border, fill = 'rgba(14,11,12,0.88)', bw = 3) {
  rect(x, y, w, h, fill); ctx.strokeStyle = border; ctx.lineWidth = bw;
  ctx.strokeRect(x + bw / 2, y + bw / 2, w - bw, h - bw);
}

// ---- Palette -------------------------------------------------------------------------
const C = {
  ink: '#100c0a', rust: '#5a3426', rustL: '#7a4a32', concrete: '#4a4a48', concreteD: '#2e2e2e',
  mud: '#4a3524', mudL: '#5e4630', sky: '#16121a', text: '#e8e0d0', dim: '#9a8f80',
  cyan: '#3ff0ff', magenta: '#ff3fb4', blood: '#ff1a1a', gold: '#f2c14e', ok: '#7fe08a', warn: '#ffb03f',
};

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
let clicks = [];
let ui = []; // boutons dessinés à la dernière image : {x, y, w, h, act}
canvas.addEventListener('pointerdown', e => {
  startAudio();
  const b = canvas.getBoundingClientRect();
  clicks.push({ x: (e.clientX - b.left) / b.width * W, y: (e.clientY - b.top) / b.height * H });
});
addEventListener('blur', () => down.clear());
function button(x, y, w, h, act) { ui.push({ x, y, w, h, act }); }
function clickedAct() { // l'action du premier bouton cliqué depuis le dernier pas
  for (const c of clicks) for (const b of ui) if (c.x >= b.x && c.x <= b.x + b.w && c.y >= b.y && c.y <= b.y + b.h) { clicks = []; return b.act; }
  clicks = []; return null;
}

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, slide = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
const sfx = {
  hit() { tone(180, 0.12, 'square', 0.35, -120); tone(90, 0.18, 'sawtooth', 0.2); },
  crit() { tone(260, 0.2, 'sawtooth', 0.35, -200); tone(70, 0.3, 'square', 0.3); },
  miss() { tone(520, 0.08, 'triangle', 0.15, 300); },
  buzz() { tone(110, 0.25, 'sawtooth', 0.12); },
  win() { [392, 494, 587].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'square', 0.2), i * 110)); },
  lose() { [330, 262, 196].forEach((f, i) => setTimeout(() => tone(f, 0.25, 'triangle', 0.22), i * 160)); },
  death() { tone(140, 0.9, 'sawtooth', 0.3, -100); },
  coin() { tone(880, 0.07, 'square', 0.15); setTimeout(() => tone(1320, 0.09, 'square', 0.15), 70); },
  click() { tone(300, 0.04, 'square', 0.1); },
};

// ---- Coqs en pixel art -------------------------------------------------------------------
// Chaque coq est une grille de cellules construite depuis son look : corps, crête, queue,
// pattes. Une passe de contour sombre donne à chaque silhouette son propre trait.
const GW = 30, GH = 28;
const spriteCache = new Map();
function buildRooster(look, pose, wounds) {
  const key = JSON.stringify([look, pose, wounds]);
  if (spriteCache.has(key)) return spriteCache.get(key);
  const cells = new Map();
  const put = (x, y, c) => { if (!c) return; x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < GW && y < GH) cells.set(x + ',' + y, c); };
  const ellipse = (cx, cy, rx, ry, c) => {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
      for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++)
        if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1) put(x, y, c);
  };
  const c = look.c;
  const size = { slim: [6, 4], round: [7, 5], big: [8, 6] }[look.body];
  const rx = size[0], ry = size[1];
  const shortLegs = look.legs === 'short';
  const cx = 13, cy = shortLegs ? 18 : 16;
  const droop = pose === 'hesitant' ? 2 : pose === 'scared' ? 3 : 0;
  // queue (derrière le corps)
  const ax = cx - rx + 1, ay = cy - 2 + droop;
  if (look.tail === 'sickle') {
    const curve = [[0, 0], [-1, -1], [-2, -2], [-3, -4], [-3, -6], [-2, -8], [-1, -9], [0, -9]];
    for (let k = 0; k < 3; k++) curve.forEach(([dx, dy], i) => { if (i < curve.length - k) { put(ax + dx - k, ay + dy + k * 2, c.tail); put(ax + dx - k + 1, ay + dy + k * 2, c.tail); } });
  } else if (look.tail === 'fan') {
    for (let dy = -8; dy <= 2; dy++) { const w = 5 - Math.floor(Math.abs(dy + 3) / 2); for (let dx = 0; dx <= w; dx++) put(ax - dx, ay + dy, (dx + dy) % 3 === 0 ? c.wing : c.tail); }
  } else if (look.tail === 'stub') {
    for (let dy = -3; dy <= 1; dy++) for (let dx = 0; dx <= 2; dx++) put(ax - dx, ay + dy, c.tail);
  } else { // spiky : plumes séparées en pointes
    [[-1, -1], [-1, 0.2], [-1, 1]].forEach(([vx, vy], k) => { for (let i = 0; i < 6 - k; i++) put(ax + vx * i, ay - 2 + k * 2 - Math.round(i * (k === 0 ? 1 : k === 1 ? 0.5 : -0.2)), c.tail); });
    for (let i = 0; i < 5; i++) put(ax - i + 1, ay - 5 - i, c.tail);
  }
  // pattes
  const legTop = cy + ry - 1;
  const legCol = look.leg || '#d1a83c', spur = look.spur || '#6e5420';
  [cx - 1, cx + 2].forEach((lx, i) => {
    const bent = pose === 'hurt' && i === 1;
    for (let y = legTop; y <= 25; y++) put(bent && y > 22 ? lx + 1 : lx, y, legCol);
    const fx = bent ? lx + 1 : lx;
    put(fx - 1, 25, legCol); put(fx + 1, 25, legCol); put(fx + 2, 25, legCol); put(fx - 1, 23, spur);
  });
  // corps et aile
  ellipse(cx, cy, rx, ry, c.body);
  ellipse(cx - 1, cy, Math.max(2, rx - 3), Math.max(2, ry - 2), c.wing);
  for (let x = cx - rx + 3; x < cx + 2; x += 2) put(x, cy + ry - 2, c.wing);
  if (pose === 'scared') [[cx - rx, cy - 2], [cx - rx + 1, cy + 3], [cx + rx, cy - 3], [cx + 2, cy - ry - 1], [cx - 3, cy - ry - 1]].forEach(([x, y]) => put(x, y, c.body));
  // cou et tête
  const hx = cx + rx - 1 + (pose === 'scared' ? -1 : 0), hy = 7 + droop + (shortLegs ? 1 : 0);
  for (let t = 0; t <= 1; t += 0.1) { const nx = cx + rx - 3 + (hx - (cx + rx - 3)) * t, ny = cy - ry + 1 + (hy + 1 - (cy - ry + 1)) * t; ellipse(nx, ny, 1.8, 1.4, c.hackle); }
  ellipse(hx, hy, 2.6, 2.4, c.hackle);
  const bk = look.beak || '#e3b448'; put(hx + 3, hy, bk); put(hx + 4, hy, bk); put(hx + 5, hy, look.beak ? bk : null); put(hx + 3, hy + 1, look.beak ? '#6a7278' : '#b88a2a'); // bec
  put(hx + 2, hy + 2, '#a32a34'); put(hx + 2, hy + 3, '#a32a34'); // barbillon
  if (look.crest === 'single') { for (let i = -1; i <= 2; i++) put(hx + i, hy - 3, c.crest); put(hx - 1, hy - 4, c.crest); put(hx + 1, hy - 4, c.crest); put(hx + 2, hy - 5, c.crest); put(hx + 0, hy - 5, c.crest); }
  else if (look.crest === 'rose') { ellipse(hx, hy - 3, 2, 1, c.crest); }
  else if (look.crest === 'mohawk') { for (let i = -2; i <= 2; i++) for (let j = 3; j <= 4 + (i + 2) % 2 + (i === 0 ? 1 : 0); j++) put(hx + i, hy - j, c.crest); }
  else { put(hx - 1, hy - 3, '#7a5040'); put(hx - 1, hy - 1, '#e8d8c0'); put(hx, hy - 2, '#e8d8c0'); } // scar : crête arrachée, cicatrice
  // œil selon l'état d'esprit
  if (pose === 'dead') { put(hx, hy - 2, C.ink); put(hx + 2, hy, C.ink); put(hx + 1, hy - 1, C.ink); put(hx + 2, hy - 2, C.ink); put(hx, hy, C.ink); }
  else if (pose === 'scared') { put(hx + 1, hy - 1, '#ffffff'); put(hx, hy - 1, '#ffffff'); put(hx + 2, hy - 1, C.ink); }
  else if (pose === 'hesitant') { put(hx + 1, hy - 1, C.ink); put(hx + 2, hy - 1, C.ink); }
  else put(hx + 1, hy - 1, C.ink);
  // sang : le seul rouge pur
  for (let i = 0; i < wounds; i++) put(cx - 3 + ((i * 5) % 8), cy - 2 + ((i * 3) % 5), C.blood);
  // contour
  const out = new Map(cells);
  for (const k of cells.keys()) {
    const [x, y] = k.split(',').map(Number);
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => { const n = (x + dx) + ',' + (y + dy); if (!cells.has(n)) out.set(n, C.ink); });
  }
  const list = [...out.entries()].map(([k, col]) => { const [x, y] = k.split(',').map(Number); return [x, y, col]; });
  spriteCache.set(key, list);
  return list;
}
// Dessine un coq : (x, y) = milieu bas, px = taille d'une cellule, face = 1 vers la droite, -1 vers la gauche.
function drawRooster(look, x, y, px, face, pose = 'normal', wounds = 0) {
  const cells = buildRooster(look, pose === 'dead' ? 'dead' : pose, wounds);
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (pose === 'dead') { ctx.translate(0, -px * 4); ctx.rotate(face > 0 ? Math.PI / 2 : -Math.PI / 2); ctx.translate(0, px * 6); }
  for (const [cx, cy, col] of cells) {
    const gx = face > 0 ? cx : GW - 1 - cx;
    rect((gx - GW / 2) * px, (cy - 26) * px, px, px, col);
  }
  ctx.restore();
}

// ---- Règles du jeu ---------------------------------------------------------------------
const STATS = ['spd', 'def', 'atk', 'esq', 'prec', 'crit', 'int'];
const STAT_NAMES = { hp: 'PDV', en: 'Énergie', spd: 'Vitesse', def: 'Défense', atk: 'Attaque', esq: 'Esquive', prec: 'Précision', crit: 'Critique', int: 'Intelligence' };
const STAT_SHORT = { spd: 'Vit', def: 'Déf', atk: 'Atq', esq: 'Esq', prec: 'Préc', crit: 'Crit', int: 'Int' };
const STYLE_NAMES = { equilibre: 'équilibré', prudent: 'prudent', brute: 'brute', vicieux: 'vicieux', fou: 'imprévisible' };
function legalEntry(d) { return tune.legalEntryBase + tune.legalEntryPerDuel * d; }
function legalPurse(d) { return tune.legalPurseBase + tune.legalPursePerDuel * d; }
function entryFor(d, circuit) { return Math.round(legalEntry(d) * (circuit === 'clan' ? tune.clanEntryMult : 1)); }

// Stats d'un de tes coqs : les plafonds de sa race, plus la redistribution choisie.
function coqStats(c) {
  const r = R.races[c.src.race], s = { hp: r.hp, en: r.en };
  for (const k of STATS) s[k] = r[k] + (c.alloc[k] || 0);
  return s;
}
// L'adversaire du duel d, tel qu'il se présente dans ce circuit.
function foeStats(d, circuit) {
  const f = R.foes[(d - 1) % R.foes.length], r = R.races[f.race];
  const m = f.level * (circuit === 'clan' ? tune.clanFoeMult : 1);
  const mod = circuit === 'clan' && f.clanMod, src = mod ? { ...f, ...mod.as, look: { ...f.look, ...mod.look } } : f, s = { src };
  for (const k of ['hp', 'en', ...STATS]) s[k] = Math.round(r[k] * m) + (mod && mod.add[k] || 0);
  return s;
}
function raceTraits(s) {
  const t = [];
  if (s.spd >= 120) t.push('rapide'); else if (s.spd <= 80) t.push('lent');
  if (s.atk >= 130) t.push('frappe fort');
  if (s.def >= 115) t.push('encaisse bien');
  if (s.esq >= 125) t.push('esquive beaucoup');
  if (s.prec >= 140) t.push('très précis');
  if (s.int >= 130) t.push('malin');
  if (s.hp >= 350) t.push('endurant');
  return t.length ? t.join(' · ') : 'sans point fort marqué';
}
function matchup(c, fs) { // phrase complète, estimation sans chiffres adverses
  const s = coqStats(c), name = c.src.name, parts = [];
  const sp = s.spd * injuryMult(c, 'spd') - fs.spd;
  parts.push(sp > 12 ? ['est plus rapide', 1] : sp < -12 ? ['est plus lent', -1] : ['est aussi rapide', 0]);
  const mine = s.atk * injuryMult(c, 'atk') / fs.def, his = fs.atk / (s.def * injuryMult(c, 'def'));
  parts.push(mine > his * 1.12 ? ['frappe plus fort que lui', 1] : his > mine * 1.12 ? ['encaisse moins bien', -1] : ['leurs coups se valent', 0]);
  if (fs.esq >= s.esq + 30) parts.push(['aura du mal à le toucher', -1]);
  else if (s.esq >= fs.esq + 30) parts.push(['l’esquivera mieux', 1]);
  const dh = s.hp - fs.hp;
  if (dh < -50) parts.push(['tient moins longtemps', -1]); else if (dh > 50) parts.push(['tient plus longtemps', 1]);
  let out = `Face à ${fs.src.name}, ${name} ${parts[0][0]}`;
  for (let i = 1; i < parts.length; i++) {
    const last = i === parts.length - 1, mixed = parts[i][1] * parts[i - 1][1] < 0;
    out += (mixed ? ', mais ' : last ? ' et ' : ', ') + parts[i][0];
  }
  return out + '.';
}

// ---- Configurations d'équilibrage ----
const PRESETS = window.PRESETS;
const PRESET_IDS = Object.keys(PRESETS);
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('ergots2:' + k)); localStorage.setItem('ergots2:' + k, JSON.stringify(v)); } catch (e) { return null; } }
function applyPreset(id) {
  if (!PRESETS[id]) return;
  for (const [k, v] of Object.entries(PRESETS[id].values)) if (CONFIG[k]) CONFIG[k].value = v;
  CONFIG.preset.value = id; store('preset', id); bookCache.clear();
  dispatchEvent(new CustomEvent('tune-refresh'));
}
addEventListener('tune', e => { if (e.detail && e.detail.key === 'preset') applyPreset(CONFIG.preset.value); else bookCache.clear(); });
function recordRun(win, why) {
  const runs = store('runs') || [];
  runs.unshift({ preset: CONFIG.preset.value, win, why, money: state.money, path: state.path.join(' '), deaths: state.deaths.length });
  store('runs', runs.slice(0, 6));
}

// ---- Combat ----
function injuryMult(f, stat) { let m = 1; for (const i of f.injuries) if (R.injuries[i.id].stat === stat) m *= 1 - tune.injuryMalus; return m; }
function moraleFactor(m) { return 1 - tune.moraleSpan / 2 + tune.moraleSpan * m / 100; }
function mood(f) { return f.morale < tune.moraleScared ? 'scared' : f.morale < tune.moraleHesitant ? 'hesitant' : 'ok'; }
function eff(f, stat) { // une stat de combat telle qu'elle est maintenant : blessures, moral, soutien, fatigue
  let v = f[stat] * injuryMult(f, stat) * moraleFactor(f.morale) * (f.turn[stat] || 1);
  if (stat === 'spd' && f.energy < f.maxEn * 0.15) v *= 0.85;
  return v;
}
function accOf(f, move, sup) { // précision affichée : connue du joueur, avant l'esquive adverse
  let a = move.acc + (eff(f, 'prec') - 100) * tune.accPerPrec * (!move.buff && kindOf(move) === 'precis' ? 2 : 1) - (f.turn.accMalus || 0);
  if (sup === 'pressure') a -= tune.pressureAcc;
  const md = mood(f); if (md === 'scared') a -= 15; else if (md === 'hesitant') a -= 5;
  if (!move.buff && f.energy < move.cost) a -= tune.tiredAcc;
  return Math.max(5, Math.min(100, Math.round(a)));
}
function dodgeOf(f) { return Math.max(0, (eff(f, 'esq') - tune.dodgeBase) * tune.dodgePerPoint) + f.dodge; }
// Les contres : chaque nature d'attaque bute sur une stat différente.
//  vif    (bec, feinte)  : difficile à esquiver, mais la défense en absorbe une part fixe.
//  précis (ergot, œil)   : la précision compte double, la défense n'en absorbe que la moitié ; mais un coq malin le lit.
//  lourd  (bond, ruée)   : traverse la défense, mais un coq plus rapide l'esquive plus facilement.
const KIND_NAMES = { vif: 'vif', precis: 'précis', lourd: 'lourd' };
function kindOf(m) { return m.kind || 'precis'; }
function dodgeVs(a, b, m) { // esquive de b contre cette attaque de a : physique, puis vitesse contre une attaque lourde
  const k = kindOf(m);
  const phys = (dodgeOf(b) - (m.ignoreGuard ? b.dodge : 0)) * (k === 'vif' ? tune.vifDodgeMult : 1);
  const slow = k === 'lourd' ? Math.max(0, eff(b, 'spd') - eff(a, 'spd')) * tune.heavySpdDodge
    : k === 'precis' ? Math.max(0, eff(b, 'int') - tune.precReadBase) * tune.precReadPerPoint : 0; // un coup précis est lisible : l'intelligence le voit venir
  return { phys, slow };
}
function readingVs(a, b, mid) {
  return a.lastMove === mid ? tune.intRepeatConsec * eff(b, 'int') / 100 : a.seen.has(mid) ? tune.intRepeatSeen * eff(b, 'int') / 100 : 0;
}
function damageVs(a, b, m, base, atkMult = 1) { // dégâts avant critique et fatigue, et part absorbée par la défense
  const k = kindOf(m);
  const atkE = eff(a, 'atk') * atkMult, defE = eff(b, 'def') * (k === 'lourd' ? tune.heavyDefMult : 1) * (b.guard && !m.ignoreGuard ? tune.guardDef : 1);
  let raw = base * 2 * atkE / (atkE + defE);
  if (m.riposte && b.lastMissed) raw *= m.riposte;
  const armor = m.ignoreArmor ? 0 : eff(b, 'def') * tune.armorPerDef * (k === 'vif' ? 1 : k === 'precis' ? 0.5 : 0);
  return { raw, armor };
}
// Chance de toucher : jamais sous un plancher, et chaque échec d'affilée rapproche de l'ouverture.
function hitChance(a, m, shown, dodge, reading) {
  return Math.max(Math.min(shown, tune.minHit), shown - dodge - reading) + a.missStreak * tune.streakBonus;
}
function lateMult(d) { return d.turnNo > tune.fatigueTurn ? 1 + (d.turnNo - tune.fatigueTurn) * tune.fatigueDamage : 1; }
// Dégâts d'une attaque qui touche, coup par coup (une rafale frappe plusieurs fois, la défense absorbe à chaque coup).
function landedDamage(d, a, b, m, tired, crit) {
  let total = 0, absorbedAll = 0;
  for (let h = 0; h < (m.hits || 1); h++) {
    const p = damageVs(a, b, m, m.min + Math.floor(rng() * (m.max - m.min + 1)));
    let x = p.raw * lateMult(d) * tune.damageScale;
    if (tired) x *= tune.tiredDamage;
    if (crit) x *= tune.critMult;
    absorbedAll += Math.min(x - 1, p.armor);
    total += Math.max(1, Math.round(x - p.armor));
  }
  return { dmg: total, absorbed: absorbedAll };
}
function makeFighter(st, src, side, injuries) {
  return { name: src.name, look: src.look, moves: src.moves, side, scale: src.scale || 1, style: src.style,
    maxHp: st.hp, hp: st.hp, maxEn: st.en, energy: st.en, spd: st.spd, def: st.def, atk: st.atk, esq: st.esq,
    prec: st.prec, crit: st.crit, int: st.int, morale: src.morale, injuries, guard: false, dodge: 0, turn: {},
    lastMove: null, seen: new Set(), fails: {}, missStreak: 0, maxStreak: 0, lastMissed: false, raceId: src.race };
}
function addInjury(f, id) {
  const ids = Object.keys(R.injuries);
  const inj = { id: id || ids[Math.floor(rng() * ids.length)], left: tune.injuryDuels };
  f.injuries.push(inj);
  return inj;
}

// IA : chaque style a sa façon de combattre
function foeChoose(f, p) {
  const ms = f.moves.map(id => ({ id, m: R.moves[id] }));
  const dmg = ms.filter(x => !x.m.buff), buffs = ms.filter(x => x.m.buff);
  const avg = x => (x.m.min + x.m.max) / 2 * x.m.acc / 100 * (x.id === f.lastMove ? 0.7 : 1);
  const best = (list, key) => list.slice().sort((a, b) => key(b) - key(a))[0];
  const patience = { brute: 3, fou: 3, prudent: 2, vicieux: 2, equilibre: 2 }[f.style] || 2;
  const learned = dmg.filter(x => !((f.fails[x.id] || 0) >= patience && rng() < tune.aiLearn)); // elle tire les leçons de ses échecs, pas toujours
  const base0 = learned.length ? learned : dmg;
  const affordable = base0.filter(x => x.m.cost <= f.energy);
  const pool = affordable.length ? affordable : base0;
  if (f.energy < f.maxEn * 0.15 && buffs.length && rng() < 0.6) return buffs[0].id;
  switch (f.style) {
    case 'brute': return best(pool, x => x.m.max).id;
    case 'prudent':
      if (f.hp < f.maxHp * 0.5 && buffs.length && rng() < 0.5) return buffs[Math.floor(rng() * buffs.length)].id;
      return best(pool, x => x.m.acc).id;
    case 'vicieux': {
      const fe = pool.find(x => x.m.moraleHit), oe = pool.find(x => x.m.injury);
      if (fe && p.morale > 35 && rng() < 0.5) return fe.id;
      if (oe && rng() < 0.6) return oe.id;
      return best(pool, avg).id;
    }
    case 'fou':
      if (f.hp < f.maxHp * 0.4) return best(pool, x => x.m.max).id;
      return pool[Math.floor(rng() * pool.length)].id;
    default:
      if (buffs.length && f.energy < f.maxEn * 0.25 && rng() < 0.5) return buffs[0].id;
      return rng() < 0.6 ? best(pool, avg).id : pool[Math.floor(rng() * pool.length)].id;
  }
}

function log(d, s) { d.log.push(s); d.history.push(s); if (d.log.length > 4) d.log.shift(); }
function snap(d) {
  const f = x => ({ hp: x.hp, energy: x.energy, morale: x.morale, injuries: x.injuries.map(i => i.id), mood: mood(x), dead: x.hp <= 0 && d.circuit === 'clan' });
  return { p: f(d.P), e: f(d.E) };
}
function beat(d, txt, fx) { if (d.sim) return; d.history.push(txt); d.beats.push({ txt, view: snap(d), fx }); }

// Un tour complet : calculé d'un coup, puis joué temps par temps (beats).
function resolveTurn(d, pm) {
  const P = d.P, E = d.E;
  P.turn = {}; E.turn = {};
  if (d.sup === 'encourage') {
    P.morale = Math.min(100, P.morale + tune.encourageMorale); P.turn.def = tune.encourageDef;
    beat(d, `Tu encourages ${P.name}. Il se redresse.`);
  } else if (d.sup === 'pressure') {
    P.morale = Math.max(0, P.morale - tune.pressureMorale);
    P.turn.atk = tune.pressureAtk; P.turn.spd = tune.pressureSpd; P.turn.accMalus = tune.pressureAcc;
    beat(d, `Tu mets la pression à ${P.name} : il s’emballe.`);
  }
  const em = foeChoose(E, P);
  const pFirst = eff(P, 'spd') + rng() * 6 >= eff(E, 'spd') + rng() * 6;
  const order = pFirst ? [[P, E, pm], [E, P, em]] : [[E, P, em], [P, E, pm]];
  for (const [a, b, mid] of order) { if (d.result) break; act(d, a, b, mid); }
  if (!d.result) endOfTurn(d);
}
function act(d, a, b, mid) {
  const m = R.moves[mid];
  const tired = !m.buff && a.energy < m.cost;
  const consec = a.lastMove === mid, seen = a.seen.has(mid);
  a.lastMove = mid; a.seen.add(mid);
  a.energy = Math.max(0, a.energy - m.cost);
  if (m.buff) {
    a.energy = Math.min(a.maxEn, a.energy + (m.energyGain || 0));
    if (m.buff === 'guard') { a.guard = true; a.morale = Math.min(100, a.morale + (m.moraleGain || 0)); beat(d, `${a.name} bat des ailes et se met en garde.`, { lunge: a.side }); }
    else if (m.foeMorale) { a.dodge = m.dodge; b.morale = Math.max(0, b.morale - m.foeMorale); beat(d, `${a.name} danse autour de ${b.name}, qui ne sait plus où regarder.`, { lunge: a.side }); }
    else { a.dodge = m.dodge; beat(d, `${a.name} se fait tout petit, prêt à esquiver.`, { lunge: a.side }); }
    return;
  }
  const shown = accOf(a, m);
  const dv = dodgeVs(a, b, m), dodge = dv.phys + dv.slow;
  const reading = consec ? tune.intRepeatConsec * eff(b, 'int') / 100 : seen ? tune.intRepeatSeen * eff(b, 'int') / 100 : 0;
  const roll = rng() * 100, chance = hitChance(a, m, shown, dodge, reading), streak = a.missStreak;
  if (roll >= chance) {
    a.morale = Math.max(0, a.morale - tune.moraleMissed - (m.missMorale || 0));
    a.fails[mid] = (a.fails[mid] || 0) + 1;
    a.missStreak++; a.maxStreak = Math.max(a.maxStreak, a.missStreak); a.lastMissed = true;
    let txt;
    if (roll >= shown) txt = `${a.name} tente ${m.name}... et rate.`;
    else if (roll >= shown - dv.phys) txt = `${a.name} tente ${m.name}... ${b.name} esquive !`;
    else if (roll >= shown - dodge) txt = kindOf(m) === 'lourd' ? `${a.name} tente ${m.name}, trop lent : ${b.name} l\u2019évite sans peine.` : `${a.name} tente ${m.name}, mais ${b.name} a lu le geste et l\u2019évite.`;
    else if (consec) txt = `${a.name} utilise ${m.name}, encore. Trop prévisible : il rate son coup.`;
    else txt = `${b.name} a déjà vu ce ${m.name} et l\u2019évite.`;
    beat(d, txt, { lunge: a.side, miss: true });
    return;
  }
  const riposte = m.riposte && b.lastMissed;
  const crit = rng() < eff(a, 'crit') * tune.critPerPoint;
  const ld = landedDamage(d, a, b, m, tired, crit), dmg = ld.dmg, absorbed = ld.absorbed;
  a.missStreak = 0; a.lastMissed = false;
  a.fails[mid] = dmg < (m.min + m.max) / 4 ? (a.fails[mid] || 0) + 1 : 0;
  b.guard = false;
  b.hp -= dmg;
  b.hp = d.circuit === 'legal' ? Math.max(1, b.hp) : Math.max(0, b.hp);
  const big = dmg >= b.maxHp * 0.15;
  let moraleHit = m.moraleHit || 0, anticipated = false;
  if (moraleHit && rng() < Math.max(0, eff(b, 'int') - tune.intFeintBase) * tune.intFeintPerPoint) { moraleHit = 0; anticipated = true; }
  b.morale = Math.max(0, b.morale - (big ? tune.moraleBigHit : tune.moraleSmallHit) - moraleHit);
  a.morale = Math.min(100, a.morale + tune.moraleLanded);
  let txt = `${streak >= 2 ? `${a.name} trouve enfin l\u2019ouverture. ` : ''}${a.name} : ${m.name} !${riposte ? ' Riposte,' : ''}${m.hits ? ` ${m.hits} coups,` : ''} ${crit ? 'Coup critique, ' : ''}${dmg} dégâts.`;
  if (m.moraleHit) txt += anticipated ? ` ${b.name} a anticipé la feinte.` : ` ${b.name} se trouble.`;
  if (absorbed >= dmg) txt += ` Le coup glisse sur sa défense.`;
  if (m.ignoreArmor && kindOf(m) === 'vif') txt += ' Il frappe là où la défense ne protège pas.';
  if (tired) txt += ' (à bout de souffle)';
  if (dmg >= b.maxHp * tune.injuryHitFrac || m.injury) {
    let ch = d.circuit === 'clan' ? tune.injuryChanceClan : tune.injuryChanceLegal;
    if (m.injury) ch *= m.injuryBoost || 1;
    if (rng() < ch) { const inj = addInjury(b, m.injury); txt += ` Blessure : ${R.injuries[inj.id].name.toLowerCase()}.`; }
  }
  if (!d.sim) d.stains.push({ x: (b.side === 'p' ? 330 : 880) + (rng() - 0.5) * 140, y: 400 + (rng() - 0.5) * 50, r: 2 + Math.floor(rng() * 3) });
  beat(d, txt, { lunge: a.side, hit: b.side, dmg, crit });
  checkEnd(d, b);
}
function checkEnd(d, b) {
  if (d.result) return;
  if (d.circuit === 'clan' && b.hp <= 0) {
    if (b.side === 'p') { d.result = 'mort'; beat(d, `${b.name} ne se relève pas.`, { death: 'p' }); }
    else { d.result = 'victoire'; beat(d, `${b.name} ne se relève pas. Victoire.`, { death: 'e' }); }
  } else if (d.circuit === 'legal' && b.hp <= b.maxHp * tune.refereeStop) {
    if (b.side === 'p') {
      d.result = 'arret';
      if (!d.P.injuries.length || rng() < 0.6) addInjury(d.P);
      beat(d, `L’arbitre arrête le combat. ${b.name} est battu, et blessé.`, { ref: true });
    } else { d.result = 'victoire'; beat(d, `L’arbitre arrête le combat. Victoire !`, { ref: true }); }
  }
}
function endOfTurn(d) {
  for (const f of [d.P, d.E]) {
    f.energy = Math.min(f.maxEn, f.energy + Math.round(f.maxEn * tune.energyRegen));
    if (f.hp < f.maxHp * 0.3) f.morale = Math.max(0, f.morale - tune.moraleLowHpDrain);
    f.dodge = 0; f.turn = {};
  }
  const E = d.E;
  if (d.circuit === 'legal' && E.morale < tune.fleeMorale && E.hp < E.maxHp * tune.fleeHp && rng() < tune.fleeChance) {
    d.result = 'victoire'; beat(d, `L’entraîneur d’en face jette l’éponge. Victoire !`, { ref: true });
  }
  d.turnNo++;
  if (d.turnNo === tune.fatigueTurn + 1) beat(d, 'Les deux coqs s\u2019épuisent : chaque coup porte davantage.');
  if (!d.sim) d.history.push(`— Tour ${d.turnNo} —`);
}

// ---- Le bookmaker ----
// Il simule le combat plusieurs fois, en secret, puis se trompe un peu : la cote est une
// estimation du milieu, pas une vérité. La partie elle-même n'est pas touchée (graine sauvée).
const bookCache = new Map();
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }
function bookOdds(c, dNo, circuit) {
  const st = coqStats(c), fs = foeStats(dNo, circuit);
  const key = JSON.stringify([c.src.id, st, c.injuries.map(i => i.id), dNo, circuit, CONFIG.preset.value]);
  if (bookCache.has(key)) return bookCache.get(key);
  const saved = seed; seed = hash(key) | 0;
  let wins = 0;
  for (let n = 0; n < tune.bookRuns; n++) {
    const d = { sim: true, circuit, sup: 'none', result: null, turnNo: 1, beats: [], log: [], history: [], stains: [] };
    d.P = makeFighter(st, { ...c.src, style: 'equilibre' }, 'p', c.injuries.map(i => ({ ...i })));
    d.E = makeFighter(fs, fs.src, 'e', []);
    while (!d.result && d.turnNo < 80) { const c2 = smartChoose(d.P, d.E); d.sup = c2.sup; resolveTurn(d, c2.move); }
    if (d.result === 'victoire') wins++;
  }
  const p = (wins + 1) / (tune.bookRuns + 2);
  const noise = ((hash(key + 'book') % 1000) / 1000 * 2 - 1) * tune.bookNoise;
  const est = Math.max(0.03, Math.min(0.97, p + noise));
  const odds = Math.max(tune.oddsMin, Math.min(tune.oddsMax, (1 / est) * (1 - tune.bookMargin)));
  seed = saved;
  const r = { odds: Math.round(odds * 10) / 10, est };
  bookCache.set(key, r);
  return r;
}
// Le joueur que simule le bookmaker : compétent. Il compare l'espérance de dégâts de chaque
// attaque (précision, esquive et lecture adverses, fatigue), avec ou sans pression, et se
// remet en garde quand il manque d'énergie ou de moral.
function smartChoose(P, E) {
  let best = null;
  for (const id of P.moves) {
    const m = R.moves[id];
    if (m.buff) continue;
    const reading = readingVs(P, E, id);
    for (const sup of ['none', 'pressure']) {
      const dv = dodgeVs(P, E, m);
      const hit = Math.min(1, hitChance(P, m, accOf(P, m, sup), dv.phys + dv.slow, reading) / 100);
      const dm = damageVs(P, E, m, (m.min + m.max) / 2, sup === 'pressure' ? tune.pressureAtk : 1);
      let ev = Math.max(1, dm.raw * tune.damageScale * (1 + eff(P, 'crit') * tune.critPerPoint * (tune.critMult - 1)) - dm.armor) * (m.hits || 1) * hit;
      if (P.energy < m.cost) ev *= tune.tiredDamage;
      if (m.moraleHit) ev *= 1.15;
      if (!best || ev > best.ev) best = { move: id, sup, ev };
    }
  }
  const buff = P.moves.find(id => R.moves[id].buff);
  if (buff && P.energy < P.maxEn * 0.15) return { move: buff, sup: 'none' };
  if (P.morale < tune.moraleHesitant && best.sup === 'none') best.sup = 'encourage';
  return best || { move: P.moves[0], sup: 'none' };
}
function oddsText(o) { return o.odds.toFixed(1).replace('.', ','); }
function oddsWord(o) { return o.est >= 0.6 ? 'favori' : o.est >= 0.4 ? 'combat serré' : o.est >= 0.2 ? 'outsider' : 'grand outsider'; }
function purseFor(dNo, circuit, c) {
  if (circuit !== 'clan') return Math.round(legalPurse(dNo));
  return Math.round(legalPurse(dNo) * tune.clanPurseBase * bookOdds(c, dNo, 'clan').odds);
}

// ---- État de la partie ------------------------------------------------------------------
let scene, state;
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = {
    t: 0, score: 0, gained: '',
    mode: 'yard', duelNo: 1, money: tune.startMoney, rentPaid: false,
    coqs: R.coqs.map(c => ({ src: c, dead: false, injuries: [], wins: 0, alloc: {} })),
    sel: 0, circuit: 'legal', note: '', noteT: 0, duel: null, over: '', deaths: [], path: [],
    carnet: new Set(R.coqs.map(c => c.race)), redist: null, redistRow: 0,
  };
  bookCache.clear();
}
function alive() { return state.coqs.filter(c => !c.dead); }
function say(s) { state.note = s; state.noteT = 300; }
function moved(c) { let t = 0; for (const k of STATS) if ((c.alloc[k] || 0) < 0) t -= c.alloc[k]; return t; }
function pool(c) { let t = 0; for (const k of STATS) t -= (c.alloc[k] || 0); return t; } // points retirés pas encore replacés

function enterArena() {
  const coq = state.coqs[state.sel];
  if (coq.dead) { say(`${coq.src.name} est mort. Choisis un autre coq.`); sfx.buzz(); return; }
  if (pool(coq) > 0) { say(`${coq.src.name} a ${pool(coq)} points à replacer (R).`); sfx.buzz(); return; }
  const entry = entryFor(state.duelNo, state.circuit);
  if (state.circuit === 'legal' && state.money < entry) { say(`Pas assez pour la mise légale (${entry}). Le clandestin, lui, fait crédit...`); sfx.buzz(); return; }
  if (state.circuit === 'clan' && state.money - entry < -tune.debtLimit) { say('Même le sous-sol ne te fait plus crédit.'); sfx.buzz(); return; }
  const odds = bookOdds(coq, state.duelNo, state.circuit);
  const purse = purseFor(state.duelNo, state.circuit, coq);
  state.money -= entry;
  const fs = foeStats(state.duelNo, state.circuit);
  state.carnet.add(fs.src.race);
  const d = {
    coq, circuit: state.circuit, entry, purse, odds, sup: 'none', move: 0,
    phase: 'choose', beats: [], beatT: 0, log: [], history: ['— Tour 1 —'], result: null, view: null, showHistory: false,
    fx: { flash: 0, neon: 0, lungeP: 0, lungeE: 0, shakeP: 0, shakeE: 0, pops: [] }, stains: [], turnNo: 1,
  };
  d.P = makeFighter(coqStats(coq), coq.src, 'p', coq.injuries);
  d.E = makeFighter(fs, fs.src, 'e', []);
  d.view = snap(d); d.initiative = initiativeOf(d);
  state.duel = d;
  log(d, state.circuit === 'clan' ? 'Sous-sol. Pas d’arbitre, pas d’abandon. Jusqu’à la mort.' : 'Arène municipale. L’arbitre arrête le combat avant la mort.');
  log(d, `${d.P.name} contre ${d.E.name}. Cote ${oddsText(odds)} (${oddsWord(odds)}).`);
  if (state.money < 0) log(d, `Tu t’es inscrit à crédit : tu dois ${-state.money} crédits au sous-sol.`);
  state.mode = 'duel';
  events.push({ type: 'duel', no: state.duelNo, circuit: state.circuit });
  sfx.buzz();
}
function abandon(d) {
  if (d.circuit === 'clan') { log(d, 'Pas d’abandon ici. On va jusqu’au bout.'); sfx.buzz(); d.fx.neon = 20; return; }
  d.result = 'abandon'; d.beats = []; beat(d, `Tu jettes l’éponge. ${d.P.name} est sauf. La mise est perdue.`, { ref: true });
  d.phase = 'anim'; d.beatT = 0;
}
// Après chaque duel, joué ou passé : repos, dettes, loyer, fin de tranche.
function afterDuel(fought) {
  for (const c of state.coqs) if (c !== fought && !c.dead) { c.injuries.forEach(i => i.left--); c.injuries = c.injuries.filter(i => i.left > 0); }
  state.duelNo++;
  bookCache.clear();
  if (!alive().length) return gameOver('Tous tes coqs sont morts. Il n’y a plus rien à parier.');
  if (state.money < 0) {
    state.money = Math.round(state.money * (1 + tune.debtInterest));
    if (state.money < -tune.debtLimit) return gameOver(`Ta dette dépasse ${tune.debtLimit} crédits. Les gars du sous-sol ont tout saisi.`);
    if (rng() < tune.reprisalChance) {
      const al = alive(), c = al[Math.floor(rng() * al.length)], inj = addInjury(c);
      say(`Représailles : des types du sous-sol sont passés au poulailler. ${c.src.name} : ${R.injuries[inj.id].name.toLowerCase()}. Dette : ${-state.money}.`);
    } else say(`Tu dois ${-state.money} crédits au sous-sol. Les intérêts courent.`);
  }
  if (state.duelNo === tune.rentDuel && !state.rentPaid) {
    if (state.money >= tune.rent) { state.money -= tune.rent; state.rentPaid = true; say(`Loyer payé : ${tune.rent} crédits. Il te reste ${state.money}.`); sfx.coin(); }
    else return gameOver(`Le loyer tombe : ${tune.rent} crédits. Tu n’en as que ${state.money}. La famille est expulsée.`);
  }
  if (state.duelNo > tune.duels) { state.gained = 'fin'; scene = 'results'; recordRun(true, 'gagné'); sfx.win(); return; }
  if (state.coqs[state.sel].dead) state.sel = state.coqs.indexOf(alive()[0]);
}
function finishDuel() {
  const d = state.duel, coq = d.coq, res = d.result;
  if (res === 'victoire') { state.money += d.purse; coq.wins++; sfx.coin(); }
  if (res === 'mort') { coq.dead = true; state.deaths.push(`${coq.src.name} (duel ${state.duelNo})`); }
  state.path.push((d.circuit === 'clan' ? 'C' : 'L') + ':' + { victoire: 'V', arret: 'D', abandon: 'A', mort: 'M' }[res]);
  events.push({ type: 'result', no: state.duelNo, res });
  state.duel = null; state.mode = 'yard';
  afterDuel(coq);
}
function skipDuel() {
  state.path.push('-');
  say(`Tu passes le duel ${state.duelNo}. Tes coqs se reposent.`);
  sfx.click();
  afterDuel(null);
}
function payRent() {
  if (state.rentPaid) return;
  if (state.money < tune.rent) { say(`Il te manque ${tune.rent - state.money} crédits pour le loyer.`); sfx.buzz(); return; }
  state.money -= tune.rent; state.rentPaid = true; say(`Loyer payé d’avance. Il te reste ${state.money}.`); sfx.coin();
}
function gameOver(why) { state.over = why; scene = 'over'; recordRun(false, why.split(/[.:]/)[0]); sfx.lose(); }
function heal(i) {
  const c = state.coqs[i];
  if (c.dead || !c.injuries.length) return;
  const cost = tune.healCost * c.injuries.length;
  if (state.money < cost) { say(`Soigner ${c.src.name} coûte ${cost} crédits. Tu n’as pas assez.`); sfx.buzz(); return; }
  state.money -= cost; c.injuries = []; bookCache.clear(); say(`${c.src.name} est soigné (${cost} crédits).`); sfx.coin();
}
// Redistribution : retirer des points d'une stat (dans la limite du total), les replacer ailleurs (jusqu'au plafond + dépassement).
function shiftStat(c, k, dir) {
  const step = tune.redistStep, a = c.alloc[k] || 0;
  if (dir < 0) {
    if (a > 0) c.alloc[k] = Math.max(0, a - step);
    else { const room = tune.redistPoints - moved(c); if (room <= 0) { say(`Tu as déjà déplacé ${tune.redistPoints} points.`); return; } c.alloc[k] = a - Math.min(step, room); }
  } else {
    if (a < 0) c.alloc[k] = Math.min(0, a + step);
    else { const room = Math.min(pool(c), tune.overCap - a); if (room <= 0) { say(pool(c) <= 0 ? 'Retire d’abord des points à une autre stat.' : `Pas plus de ${tune.overCap} au-dessus du plafond de la race.`); return; } c.alloc[k] = a + Math.min(step, room); }
  }
  bookCache.clear(); sfx.click();
}

    text(`Mise ${entryFor(state.duelNo, k)} · Prime ${purse}`, x + 126, y + 52, 15, C.gold);
    const rules = k === 'clan' ? ['Prime selon la cote', 'Jusqu’à la mort', 'Abandon refusé', 'Crédit possible : dettes'] : [`Arbitre à ${Math.round(tune.refereeStop * 100)} % de vie`, 'Prime fixe', 'Abandon permis', 'Pas de crédit'];
    rules.forEach((r, j) => text(r, x + 126, y + 84 + j * 22, 14, C.text, 'center', false));
    button(x, y, 252, 176, 'circ-' + k);
  });
  frameBox(980, 464, 280, 112, C.ok, 'rgba(20,46,24,0.95)', 4);
  text('ENTRER', 1120, 502, 28, C.ok);
  text('dans l’arène (Entrée)', 1120, 538, 15, C.text);
  button(980, 464, 280, 112, 'go');
  frameBox(980, 584, 136, 56, '#5a4a3e', 'rgba(20,16,16,0.95)', 2);
  text('N : passer', 1048, 604, 14, C.text); text('repos', 1048, 624, 12, C.dim, 'center', false);
  button(980, 584, 136, 56, 'skip');
  frameBox(1124, 584, 136, 56, '#5a4a3e', 'rgba(20,16,16,0.95)', 2);
  text('R : répartir', 1192, 604, 14, C.text); text('les points', 1192, 624, 12, C.dim, 'center', false);
  button(1124, 584, 136, 56, 'redist');
  if (state.noteT > 0) { frameBox(452, 648, 808, 64, C.gold, 'rgba(30,24,10,0.95)', 2); wrap(state.note, 466, 668, 780, 14, C.gold, true, 20); }
  else text('1-3 coq · L/C circuit · S soigner · P loyer · N passer · R répartir · Entrée arène', 856, 680, 13, C.dim, 'center', false);
  if (state.redist !== null) drawRedist();
}
function drawRedist() {
  const c = state.coqs[state.redist], st = coqStats(c), r = R.races[c.src.race];
  rect(0, 0, W, H, 'rgba(6,4,6,0.78)');
  frameBox(300, 80, 680, 560, C.gold, 'rgba(18,14,14,0.98)', 4);
  text(`Répartir les points de ${c.src.name} · ${raceLabel(c.src.race)}`, W / 2, 112, 20, C.gold);
  text(`Déplacés ${moved(c)}/${tune.redistPoints} · à replacer ${pool(c)} · plafond de la race +${tune.overCap} au maximum`, W / 2, 142, 14, C.text, 'center', false);
  STATS.forEach((k, j) => {
    const y = 186 + j * 52, a = c.alloc[k] || 0, sel = state.redistRow === j;
    if (sel) rect(320, y - 22, 640, 44, 'rgba(242,193,78,0.12)');
    text(STAT_NAMES[k], 340, y, 17, sel ? C.gold : C.text, 'left');
    text(`plafond ${r[k]}`, 520, y, 13, C.dim, 'left', false);
    bar(620, y - 7, 200, 14, st[k] / 171, a > 0 ? C.ok : a < 0 ? C.warn : '#9ab07a');
    rect(620 + 200 * r[k] / 171, y - 11, 2, 22, C.text);
    text(`${st[k]}${a ? (a > 0 ? ` (+${a})` : ` (${a})`) : ''}`, 940, y, 16, a > 0 ? C.ok : a < 0 ? C.warn : C.text, 'right');
    button(320, y - 22, 640, 44, 'row' + j);
  });
  text('↑↓ choisir · ← retirer · → ajouter · Entrée ou Échap : fermer', W / 2, 560, 15, C.dim, 'center', false);
  text(pool(c) > 0 ? `Il reste ${pool(c)} points à replacer avant le prochain duel.` : 'Le bookmaker recalcule la cote à chaque changement.', W / 2, 600, 15, pool(c) > 0 ? C.warn : C.dim, 'center', false);
}

// ---- Scènes ----------------------------------------------------------------------------------
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      clear('#1a1416');
      const all = [...R.coqs.map(c => [c, 'Joueur']), ...R.foes.map(f => [f, 'Adversaire']), ...R.foes.filter(f => f.clanMod).map(f => [{ ...f, ...f.clanMod.as, look: { ...f.look, ...f.clanMod.look } }, 'Clandestin'])];
      all.forEach(([c, kind], i) => {
        const x = 110 + (i % 6) * 210, y = 300 + Math.floor(i / 6) * 330;
        drawRooster(c.look, x, y, 6, 1);
        text(c.name, x, y + 26, 18, C.text);
        text(`${kind} · ${R.races[c.race].name}`, x, y + 50, 14, C.dim, 'center', false);
      });
    },
  },
  title: {
    update() {
      state.t += STEP;
      const act = clickedAct(), i = PRESET_IDS.indexOf(CONFIG.preset.value);
      if (pressed('ArrowRight')) { applyPreset(PRESET_IDS[(i + 1) % PRESET_IDS.length]); sfx.click(); }
      if (pressed('ArrowLeft')) { applyPreset(PRESET_IDS[(i + PRESET_IDS.length - 1) % PRESET_IDS.length]); sfx.click(); }
      if (act && act.startsWith('preset-')) { applyPreset(act.slice(7)); sfx.click(); }
      if (pressed('Enter') || pressed('Space') || act === 'start') { reset(); scene = 'play'; sfx.click(); }
    },
    draw() {
      ui = [];
      drawYardBg();
      rect(0, 0, W, H, 'rgba(10,8,10,0.6)');
      ctx.save(); ctx.shadowColor = C.magenta; ctx.shadowBlur = Math.floor(state.t * 8) % 13 === 0 ? 0 : 30;
      text(TITLE, W / 2, 70, 84, C.magenta); ctx.restore();
      text('Des coqs, un loyer, et la mort au bout de chaque pari.', W / 2, 132, 20, C.text);
      text('Configuration d’équilibrage (← →)', W / 2, 172, 17, C.gold);
      PRESET_IDS.forEach((id, i) => {
        const x = 40 + i * 305, y = 188, sel = CONFIG.preset.value === id, p = PRESETS[id];
        frameBox(x, y, 290, 116, sel ? C.gold : '#4a3e36', sel ? 'rgba(50,38,16,0.95)' : 'rgba(16,12,14,0.92)', sel ? 4 : 2);
        text(p.name, x + 145, y + 22, 17, sel ? C.gold : C.text);
        wrap(p.desc, x + 14, y + 50, 262, 14, sel ? C.text : C.dim);
        button(x, y, 290, 116, 'preset-' + id);
      });
      CONTROLS.forEach((c, i) => text(c, W / 2, 330 + i * 26, 15, C.dim, 'center', false));
      const runs = store('runs') || [];
      frameBox(250, 418, 780, 210, '#4a3e36', 'rgba(14,11,12,0.92)', 2);
      text('Dernières parties', 270, 438, 16, C.text, 'left');
      if (!runs.length) text('Aucune pour l’instant.', 270, 470, 15, C.dim, 'left', false);
      runs.forEach((r, i) => {
        text(`${r.win ? 'GAGNÉ' : 'PERDU'} · ${r.preset} · ${r.money} cr. · ${r.deaths} mort${r.deaths > 1 ? 's' : ''}`, 270, 468 + i * 26, 14, r.win ? C.ok : C.warn, 'left');
        text(r.path, 640, 468 + i * 26, 14, C.dim, 'left', false);
      });
      text('L/C : circuit · V victoire, D arrêt, A abandon, M mort, - duel passé', 640, 612, 12, C.dim, 'center', false);
      drawRooster(R.coqs[0].look, 120, 640, 6, 1);
      drawRooster(R.foes[2].look, 1160, 640, 6, -1);
      frameBox(440, 646, 400, 56, C.cyan, 'rgba(10,30,34,0.95)', 3);
      text('Entrée pour commencer', W / 2, 674, 24, C.cyan);
      button(440, 646, 400, 56, 'start');
    },
  },
  play: {
    update(dt) {
      state.t += dt;
      if (state.noteT > 0) state.noteT--;
      const act = clickedAct();
      if (state.mode === 'yard') return yardUpdate(act);
      duelUpdate(act);
    },
    draw() { ui = []; if (state.mode === 'yard') drawYard(); else drawDuel(); },
  },
  over: {
    update() { if (pressed('Escape')) { reset(); scene = 'title'; return; } if (pressed('KeyR') || pressed('Enter') || clicks.length) { clicks = []; reset(); scene = 'play'; } },
    draw() {
      clear('#120a0c');
      text('FIN DE LA PARTIE', W / 2, 200, 56, C.blood);
      wrap(state.over, 240, 290, 800, 24, C.text);
      if (state.deaths.length) text(`Morts : ${state.deaths.join(', ')}`, W / 2, 420, 20, C.warn);
      text(`Duels : ${state.duelNo - 1} · ${state.path.join(' ')}`, W / 2, 460, 20, C.dim);
      text(`Équilibrage : ${PRESETS[CONFIG.preset.value] ? PRESETS[CONFIG.preset.value].name : 'personnalisé'}`, W / 2, 496, 18, C.dim);
      text('R ou Entrée : recommencer · Échap : écran titre', W / 2, 580, 24, C.cyan);
    },
  },
  results: {
    update() { if (pressed('Escape')) { reset(); scene = 'title'; return; } if (pressed('Enter') || clicks.length) { clicks = []; reset(); scene = 'play'; } },
    draw() {
      clear('#0e120e');
      text('TU AS TENU', W / 2, 150, 56, C.ok);
      text(`${tune.duels} duels · loyer payé · caisse finale ${state.money} crédits`, W / 2, 230, 22, C.text);
      const alv = alive();
      text(`Survivants : ${alv.map(c => c.src.name).join(', ')}`, W / 2, 280, 22, C.text);
      text(state.deaths.length ? `Morts : ${state.deaths.join(', ')}` : 'Aucun coq mort.', W / 2, 320, 20, state.deaths.length ? C.warn : C.dim);
      text(`${state.path.join(' ')} · équilibrage ${CONFIG.preset.value}`, W / 2, 356, 18, C.dim);
      alv.forEach((c, i) => drawRooster(c.src.look, W / 2 - (alv.length - 1) * 130 + i * 260, 560, 7, 1, 'normal', 0));
      text('Entrée : rejouer · Échap : écran titre', W / 2, H - 50, 24, C.cyan);
    },
  },
};

function yardUpdate(act) {
  if (state.redist !== null) {
    const c = state.coqs[state.redist];
    if (pressed('ArrowUp')) state.redistRow = (state.redistRow + STATS.length - 1) % STATS.length;
    if (pressed('ArrowDown')) state.redistRow = (state.redistRow + 1) % STATS.length;
    if (act && act.startsWith('row')) state.redistRow = Number(act.slice(3));
    if (pressed('ArrowLeft')) shiftStat(c, STATS[state.redistRow], -1);
    if (pressed('ArrowRight')) shiftStat(c, STATS[state.redistRow], 1);
    if (pressed('Escape') || pressed('Enter') || pressed('KeyR')) state.redist = null;
    return;
  }
  for (let i = 0; i < 3; i++) if (pressed('Digit' + (i + 1)) || act === 'sel' + i) { state.sel = i; sfx.click(); }
  if (pressed('KeyL') || act === 'circ-legal') { state.circuit = 'legal'; sfx.click(); }
  if (pressed('KeyC') || act === 'circ-clan') { state.circuit = 'clan'; sfx.click(); }
  if (pressed('KeyS')) heal(state.sel);
  for (let i = 0; i < 3; i++) if (act === 'heal' + i) heal(i);
  if (pressed('KeyP') || act === 'rent') payRent();
  if (pressed('KeyN') || act === 'skip') return skipDuel();
  if (pressed('KeyR') || act === 'redist') { if (!state.coqs[state.sel].dead) { state.redist = state.sel; state.redistRow = 0; sfx.click(); } }
  if (pressed('Enter') || pressed('Space') || act === 'go') enterArena();
}
function initiativeOf(d) {
  const p = eff(d.P, 'spd') * (d.sup === 'pressure' ? tune.pressureSpd : 1), e = eff(d.E, 'spd'), gap = p - e;
  return gap > 8 ? 'tu frappes en premier' : gap < -8 ? 'il frappe en premier' : 'incertaine';
}
function duelUpdate(act) {
  const d = state.duel, fx = d.fx;
  for (const k of ['flash', 'neon', 'lungeP', 'lungeE', 'shakeP', 'shakeE']) if (fx[k] > 0) fx[k]--;
  fx.pops = fx.pops.filter(p => --p.t > 0);
  d.initiative = initiativeOf(d);
  if (pressed('KeyH') || act === 'history') { d.showHistory = !d.showHistory; return; }
  if (d.showHistory) { if (pressed('Escape')) d.showHistory = false; return; }
  if (d.phase === 'choose') {
    for (let i = 0; i < 4; i++) if (pressed('Digit' + (i + 1)) || act === 'move' + i) { d.move = i; sfx.click(); }
    if (pressed('KeyE') || act === 'sup-encourage') { d.sup = d.sup === 'encourage' ? 'none' : 'encourage'; sfx.click(); }
    if (pressed('KeyP') || act === 'sup-pressure') { d.sup = d.sup === 'pressure' ? 'none' : 'pressure'; sfx.click(); }
    if (act === 'sup-none') d.sup = 'none';
    if (pressed('KeyA') || act === 'quit') return abandon(d);
    if (pressed('Space') || pressed('Enter') || act === 'go') {
      d.beats = []; resolveTurn(d, d.P.moves[d.move]); d.phase = 'anim'; d.beatT = 0; d.sup = 'none';
    }
  } else if (d.phase === 'anim') {
    if (d.beatT <= 0) {
      const b = d.beats.shift();
      if (!b) {
        d.phase = d.result ? 'over' : 'choose';
        if (d.result === 'victoire') sfx.win(); else if (d.result) sfx.lose();
        return;
      }
      d.log.push(b.txt); if (d.log.length > 4) d.log.shift();
      d.view = b.view;
      const f = b.fx || {};
      if (f.lunge === 'p') fx.lungeP = 14; if (f.lunge === 'e') fx.lungeE = 14;
      if (f.hit) {
        fx[f.hit === 'p' ? 'shakeP' : 'shakeE'] = 16; fx.flash = f.crit ? 14 : 6; fx.neon = 18;
        fx.pops.push({ s: '-' + f.dmg, x: f.hit === 'p' ? 340 : 900, y: 250, t: 40, col: C.blood, big: f.crit });
        f.crit ? sfx.crit() : sfx.hit();
      }
      if (f.miss) sfx.miss();
      if (f.death) { sfx.death(); fx.neon = 40; }
      if (f.ref) sfx.buzz();
      d.beatT = tune.beatSteps;
    } else d.beatT--;
    if (pressed('Space') || pressed('Enter') || act === 'go') d.beatT = 0;
  } else if (d.phase === 'over') {
    if (pressed('Enter') || pressed('Space') || act === 'next') finishDuel();
  }
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

applyPreset(params.get('preset') || store('preset') || CONFIG.preset.value);
reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
